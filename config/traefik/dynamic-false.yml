http:
  routers:
    # Frontend route — native Plane auth
    frontend:
      entryPoints: [web]
      rule: "PathPrefix(`/`)"
      priority: 1
      service: frontend-web

    # OPTIONS preflight — no ForwardAuth (CORS)
    api-options:
      entryPoints: [web]
      rule: "Method(`OPTIONS`)"
      priority: 40
      service: api

    # God-mode UI — no ForwardAuth (uses local email/password)
    api-godmode:
      entryPoints: [web]
      rule: "PathPrefix(`/god-mode`)"
      priority: 20
      service: api

    # God-mode API — no ForwardAuth (instance admin endpoints use their own session)
    api-instances:
      entryPoints: [web]
      rule: "PathPrefix(`/api/instances`)"
      priority: 25
      service: api

    # oauth2-proxy routes — no ForwardAuth (handles its own auth flow)
    oauth2-proxy:
      entryPoints: [web]
      rule: "PathPrefix(`/oauth2`)"
      priority: 30
      service: oauth2-proxy

    # All API routes — no ForwardAuth, native Plane auth
    api:
      entryPoints: [web]
      rule: "PathPrefix(`/api`) || PathPrefix(`/auth`)"
      priority: 10
      service: api

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://api:8000"

    frontend-web:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3000"

    oauth2-proxy:
      loadBalancer:
        servers:
          - url: "http://oauth2-proxy:4180"
